<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-label="How a cutting plan is made: from the pieces and the stock, column generation alternates a linear program that prices the pieces and a knapsack that finds the most valuable pattern, until no pattern helps; this gives a lower bound. Diving and CP-SAT then build an integer plan; equal to the bound means proven least. An independent check comes before the cut sheets, cut list, offcuts and savings." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a cutting plan is made</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="261" rx="14" fill="#0d1117" stroke="#30363d"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8b949e"/></marker></defs><rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="10.0s" begin="0s;t.end"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0200;0.0550;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="24" y="70" width="148" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="36" y="92" font-size="14" font-weight="700" fill="#e6edf3">Pieces + stock</text><text x="36" y="109" font-size="11.5" fill="#8b949e">lengths, sizes, kerf,</text><text x="36" y="123" font-size="11.5" fill="#8b949e">trim, grain, prices</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0900;0.1250;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="204" y="40" width="170" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="216" y="62" font-size="14" font-weight="700" fill="#e6edf3">Prices</text><text x="216" y="79" font-size="11.5" fill="#8b949e">linear program (HiGHS):</text><text x="216" y="93" font-size="11.5" fill="#8b949e">what each piece is worth</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1400;0.1750;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="204" y="150" width="170" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="216" y="172" font-size="14" font-weight="700" fill="#e6edf3">Best pattern</text><text x="216" y="189" font-size="11.5" fill="#8b949e">knapsack: the bar or</text><text x="216" y="203" font-size="11.5" fill="#8b949e">sheet worth most</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4300;0.4650;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="420" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/><text x="432" y="92" font-size="14" font-weight="700" fill="#e6edf3">Lower bound</text><text x="432" y="109" font-size="11.5" fill="#8b949e">no plan can cost less</text><text x="432" y="123" font-size="11.5" fill="#8b949e">than this</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="612" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="624" y="92" font-size="14" font-weight="700" fill="#e6edf3">Integer plan</text><text x="624" y="109" font-size="11.5" fill="#8b949e">diving and CP-SAT</text><text x="624" y="123" font-size="11.5" fill="#8b949e">over all patterns</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6400;0.6750;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="804" y="70" width="172" height="62" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/><text x="816" y="92" font-size="14" font-weight="700" fill="#e6edf3">Independent check</text><text x="816" y="109" font-size="11.5" fill="#8b949e">every piece, kerf, trim,</text><text x="816" y="123" font-size="11.5" fill="#8b949e">grain, straight cuts</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0700;0.1000;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M172 101 C188 101 188 71 200 71" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1200;0.1500;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M330 102 L330 146" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1600;0.1900;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M248 150 L248 106" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4100;0.4400;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M374 71 C398 71 398 101 416 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4800;0.5100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M580 101 L608 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6200;0.6500;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M772 101 L800 101" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
<path id="loop" d="M290 102 L290 150 L290 102 Z" fill="none" stroke="none"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1800;0.2000;0.4100;0.4101;1" dur="10.0s" begin="t.begin" fill="freeze"/><circle r="5" fill="#f0883e"><animateMotion dur="0.7s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2300;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><text x="392" y="188" font-size="12.5" font-weight="700" fill="#f0883e">column generation</text><text x="392" y="205" font-size="11.5" fill="#8b949e">repeat until no pattern helps</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5400;0.5700;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><text x="612" y="160" font-size="12" fill="#e6edf3">plan = bound: proven least</text><text x="612" y="176" font-size="11.5" fill="#8b949e">otherwise the best found in time</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7300;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><text x="890" y="160" text-anchor="middle" font-size="12" fill="#e6edf3">cut sheets (PDF) · cut list</text><text x="890" y="176" text-anchor="middle" font-size="12" fill="#e6edf3">offcuts to keep · savings</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6900;0.7200;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M890 132 L890 146" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
<text x="24" y="34" font-size="13" font-weight="700" fill="#e6edf3">How a cutting plan is made</text><text x="24" y="232" font-size="11.5" fill="#8b949e">A pattern is one way to cut one bar or sheet; the plan is how many times to cut each pattern.</text>
</svg>
